name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.editorconfig'
      - '.notes/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: hashFiles('package.json') != ''

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Install dependencies
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install --frozen-lockfile
          elif [ -f "package.json" ]; then
            pnpm install
          fi

      - name: Run build (if defined)
        run: |
          if [ -f "package.json" ] && node -e "const p = JSON.parse(require('fs').readFileSync('package.json', 'utf8')); process.exit(p.scripts && p.scripts.build ? 0 : 1)" 2>/dev/null; then
            pnpm build
          fi

      - name: Run check/tests (if defined)
        run: |
          if [ -f "package.json" ] && node -e "const p = JSON.parse(require('fs').readFileSync('package.json', 'utf8')); process.exit(p.scripts && p.scripts.check ? 0 : 1)" 2>/dev/null; then
            pnpm check
          fi

      - name: Apply Cloudflare D1 Migrations (GitOps Auto-Sync)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [ -d "migrations" ] && ( [ -f "wrangler.jsonc" ] || [ -f "wrangler.json" ] || [ -f "wrangler.toml" ] ); then
            pnpm exec wrangler d1 migrations apply --remote || true
          fi

      - name: Deploy to Cloudflare Worker (if configured)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [ -f "wrangler.jsonc" ] || [ -f "wrangler.json" ] || [ -f "wrangler.toml" ]; then
            pnpm exec wrangler deploy
          fi
